<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- 96px, 10 kB. Apontava para praxis-simbolo.png, de 1080px e 567 kB, que
         o navegador baixava inteiro em toda visita só para desenhar a aba. -->
    <link rel="icon" type="image/png" href="/praxis-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070905" />

    <!-- SEO Básico -->
    <title>Calculadora de Custos para Impressão 3D | Praxis Digital</title>
    <meta name="description" content="Calcule o custo real de cada peça impressa em 3D e veja quanto sobra depois das taxas da Shopee, do TikTok Shop e do Mercado Livre." />

    <!-- Open Graph / Twitter Cards
         TODO(dono): og:image e og:url precisam de URL absoluta com o domínio
         real. Facebook, LinkedIn e WhatsApp descartam caminho relativo, então
         hoje o link compartilhado sai sem imagem. Falta o domínio para
         preencher, e o mesmo valor resolve os [A DEFINIR] das páginas legais. -->
    <meta property="og:site_name" content="Praxis Digital" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Calculadora de Custos para Impressão 3D | Praxis Digital" />
    <meta property="og:description" content="Custo real por peça impressa em 3D, com as taxas da Shopee, do TikTok Shop e do Mercado Livre na conta." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/praxis-horizontal-escuro.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Montserrat.
         400/500/600/700/800: o site usa font-medium (500) e font-bold (700)
         além dos pesos base, e sem eles o navegador caía no peso carregado
         mais próximo em vez do peso pedido pela classe. O 300 fica de fora,
         porque nenhuma classe do site usa e seria um arquivo baixado à toa.
         O par preload + onload tira a folha do caminho de renderização, e o
         noscript cobre quem está sem JS. display=swap já garante texto
         visível enquanto a fonte carrega. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
